<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f4f5" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1117" />
  <title>MyAgent 远端</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1117;
      --bg-elevated: #151922;
      --card: #171a21;
      --bd: #2a3140;
      --tx: #e6e9ef;
      --muted: #8892a6;
      --accent: #5b9cf6;
      --accent-soft: rgba(91, 156, 246, 0.15);
      --user-bubble: #212835;
      --ast-bubble: #181c26;
      --chip-on: #1e2a3d;
      --ok-bg: #1f2f24;
      --ok-bd: #35604a;
      --err-bg: #3d1f24;
      --err-bd: #7a2933;
      --err-tx: #fdd;
      --shadow: 0 4px 24px rgba(0,0,0,.35);
      --unread: #ef4444;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f4f5;
        --bg-elevated: #fff;
        --card: #fff;
        --bd: #d4d4d8;
        --tx: #18181b;
        --muted: #71717a;
        --accent: #2563eb;
        --accent-soft: rgba(37, 99, 235, 0.12);
        --user-bubble: #e4e4e7;
        --ast-bubble: #fafafa;
        --chip-on: #dbeafe;
        --shadow: 0 4px 20px rgba(0,0,0,.08);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; height: 100dvh; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--tx);
      padding: 0;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .app {
      max-width: 720px;
      margin: 0 auto;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .top-bar {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      align-items: center;
      padding: calc(6px + env(safe-area-inset-top)) 10px 8px;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--bd);
      /** 保证模型下拉浮在 tab/主内容之上（否则伸到下方会被遮住） */
      position: relative;
      z-index: 40;
    }
    .top-bar-brand {
      grid-column: 1 / -1;
      grid-row: 1;
      justify-self: center;
      max-width: 70vw;
      font-weight: 650;
      font-size: 1rem;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }
    .top-bar-slot-l {
      grid-column: 1;
      grid-row: 1;
      justify-self: start;
      z-index: 1;
    }
    .top-bar-slot-r {
      grid-column: 3;
      grid-row: 1;
      justify-self: end;
      z-index: 2;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 4px;
    }
    .model-pick-wrap {
      position: relative;
    }
    .btn-model-compact {
      appearance: none;
      max-width: 118px;
      height: 36px;
      padding: 0 8px;
      border-radius: 10px;
      border: 1px solid var(--bd);
      background: var(--card);
      color: var(--tx);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      white-space: nowrap;
    }
    .btn-model-compact:active { opacity: 0.9; }
    .btn-model-compact #modelMenuLabel {
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      flex: 1;
      text-align: left;
    }
    .btn-model-che { flex-shrink: 0; opacity: 0.75; font-size: 10px; margin-top: 1px; }
    .model-popover {
      position: absolute;
      top: calc(100% + 5px);
      right: 0;
      width: min(278px, calc(100vw - 56px));
      max-height: min(340px, 52vh);
      overflow-y: auto;
      overflow-x: hidden;
      border-radius: 12px;
      border: 1px solid var(--bd);
      background: var(--bg-elevated);
      box-shadow: var(--shadow);
      -webkit-overflow-scrolling: touch;
      z-index: 120;
    }
    .model-popover.hidden { display: none; }
    .model-pop-tip {
      font-size: 11px;
      color: var(--muted);
      padding: 10px 10px 6px;
      border-bottom: 1px solid var(--bd);
    }
    button.model-opt {
      display: block;
      width: 100%;
      margin: 0;
      padding: 10px 11px;
      border: none;
      border-bottom: 1px solid var(--bd);
      background: transparent;
      color: var(--tx);
      font-size: 14px;
      text-align: left;
      cursor: pointer;
      line-height: 1.3;
      word-break: break-word;
    }
    button.model-opt:last-child { border-bottom: none; }
    button.model-opt.on {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }
    button.model-opt:active { filter: brightness(0.95); }
    .icon-btn {
      appearance: none;
      flex-shrink: 0;
      min-width: 38px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--bd);
      background: var(--card);
      color: var(--tx);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }
    .icon-btn:active { opacity: .92; }

    .drawer-mask {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(0,0,0,.45);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .drawer-mask.on {
      opacity: 1;
      visibility: visible;
    }
    .drawer {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      width: min(316px, 100vw - 36px);
      z-index: 100;
      background: var(--bg-elevated);
      border-right: 1px solid var(--bd);
      transform: translateX(-105%);
      transition: transform 0.26s ease-out;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      box-shadow: var(--shadow);
    }
    .drawer.on { transform: translateX(0); }

    .drawer-head {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 10px;
      border-bottom: 1px solid var(--bd);
    }
    .drawer-title {
      flex: 1;
      font-weight: 650;
      font-size: 15px;
    }
    .drawer-token {
      flex-shrink: 0;
      padding: 12px 10px;
      border-bottom: 1px solid var(--bd);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .drawer-token .tok-lbl {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .drawer-token-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .drawer-token-row input[type="text"] {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      border-radius: 10px;
      border: 1px solid var(--bd);
      padding: 8px 11px;
      background: var(--card);
      color: var(--tx);
    }
    .drawer .drawer-sess-lbl {
      padding: 0 10px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    button.drawer-x {
      border: none;
      background: transparent !important;
      box-shadow: none !important;
      font-size: 24px;
      font-weight: 300;
      min-width: 36px;
    }

    .drawer #sess.sess-list-wrap {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 8px 10px calc(14px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    button.btn, a.btn-link {
      appearance: none;
      font: inherit;
      border-radius: 10px;
      border: 1px solid var(--bd);
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 500;
      background: var(--card);
      color: var(--tx);
      cursor: pointer;
    }
    button.btn:active { transform: scale(.98); opacity: .92; }
    button.btn-primary {
      border-color: transparent;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    a.btn-link {
      text-decoration: none;
      font-size: 12px;
      padding: 6px 10px;
      display: inline-flex;
      align-items: center;
      color: var(--accent);
      border-color: var(--accent-soft);
      background: var(--accent-soft);
    }
    .btn-sm {
      padding: 6px 10px;
      font-size: 12px;
      flex-shrink: 0;
      white-space: nowrap;
    }

    button.sess-card {
      appearance: none;
      font: inherit;
      text-align: left;
      width: 100%;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--bd);
      background: var(--card);
      color: var(--tx);
      cursor: pointer;
      box-shadow: 0 1px 0 rgba(255,255,255,.03);
      position: relative;
    }
    button.sess-card:active { opacity: .92; }
    button.sess-card.on {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .sess-card-title { font-size: 14px; font-weight: 600; line-height: 1.3; padding-right: 56px; }
    .sess-card-meta { margin-top: 4px; font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
    .sess-card .pill-unread {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--unread);
    }

    .tabbar {
      flex-shrink: 0;
      display: flex;
      margin: 0 12px 6px;
      border: 1px solid var(--bd);
      border-radius: 11px;
      padding: 3px;
      background: var(--card);
      gap: 4px;
      position: relative;
      z-index: 25;
    }
    .tabbar button {
      flex: 1;
      border: none;
      padding: 9px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: transparent;
      color: var(--muted);
    }
    .tabbar button.on {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .panels-wrap {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 18;
    }

    main.panel {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    main.panel.active { display: flex; }

    #thread {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 10px 12px;
      min-height: 0;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
    }

    .bubble-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 92%;
      margin-bottom: 10px;
    }
    .bubble-wrap.align-user { align-self: flex-end; align-items: flex-end; margin-left: 10%; }
    .bubble-wrap.align-ast { align-self: flex-start; align-items: flex-start; margin-right: 6%; }

    .msg-role-out {
      align-self: stretch;
      width: 100%;
      font-size: 12px;
      font-weight: 650;
      color: var(--muted);
      line-height: 1.2;
      margin-bottom: 2px;
    }
    .msg-role-out.out-user { text-align: right; }
    .msg-role-out.out-ast { text-align: left; }

    .bubble {
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--bd);
      font-size: 14px;
      line-height: 1.45;
      word-break: break-word;
      white-space: normal;
      /** 长按自定义菜单时屏蔽系统「全选 / 拖动选区 / iOS 放大镜与链接预览」 */
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #thread .bubble * {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    .bubble.user {
      background: linear-gradient(145deg, #14b8a6 0%, #0d9488 100%);
      color: #fff;
      border-color: rgba(45, 212, 191, 0.35);
    }
    .bubble.ast {
      background: var(--card);
      color: var(--tx);
      border-color: var(--bd);
    }
    /** 在等待首包时与桌面一致的「···」跳动 */
    @keyframes remote-dot-bounce {
      0%,
      80%,
      100% {
        opacity: 0.35;
        transform: translateY(0);
      }
      40% {
        opacity: 1;
        transform: translateY(-5px);
      }
    }
    .typing-wait-bubble {
      min-width: 64px;
      padding: 12px 16px;
      box-sizing: border-box;
    }
    .remote-type-dots {
      display: flex;
      align-items: center;
      gap: 5px;
      min-height: 1rem;
      color: var(--muted);
      font-weight: bold;
      line-height: 1;
    }
    .remote-type-dots span {
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: currentColor;
      animation: remote-dot-bounce 1s ease-in-out infinite both;
    }
    .remote-type-dots span:nth-child(2) {
      animation-delay: 0.14s;
    }
    .remote-type-dots span:nth-child(3) {
      animation-delay: 0.28s;
    }
    .bubble.user .msg-body a {
      color: #ecfdfa;
      text-decoration: underline;
    }
    .bubble.user .attach-row a.attach-chip,
    .bubble.user .attach-row button.attach-chip {
      border-color: rgba(255, 255, 255, 0.45);
      background: rgba(0, 0, 0, 0.08);
      color: rgba(240, 253, 250, 0.96);
    }
    .bubble.user .msg-table-wrap {
      border-color: rgba(255, 255, 255, 0.35);
    }
    .bubble.user .msg-table-wrap th {
      background: rgba(0, 0, 0, 0.18);
      color: #fff;
    }
    .bubble.user .msg-table-wrap td {
      border-color: rgba(255, 255, 255, 0.32);
    }
    .bubble.ast .msg-table-wrap th {
      background: rgba(136, 146, 166, 0.14);
      color: var(--tx);
    }

    .bubble.user details.msg-thought {
      border-color: rgba(255, 255, 255, 0.4);
      background: rgba(0, 0, 0, 0.1);
    }
    .bubble.user details.msg-thought summary {
      color: rgba(255, 255, 255, 0.85);
    }
    .bubble.user .thought-pre {
      color: rgba(255, 255, 255, 0.92);
    }

    details.msg-thought {
      margin: 8px 0;
      font-size: 12px;
      border-radius: 10px;
      border: 1px solid rgba(16, 185, 129, 0.25);
      background: rgba(7, 11, 16, 0.92);
      padding: 8px 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      details.msg-thought { background: rgba(5, 8, 12, 0.94); }
    }
    details.msg-thought summary { cursor: pointer; color: rgba(167, 243, 208, 0.88); font-weight: 600; list-style: none; font-size: 11px; }
    details.msg-thought summary::-webkit-details-marker { display: none; }
    .thought-pre {
      margin: 6px 0 0;
      white-space: pre-wrap;
      font-size: 11px;
      line-height: 1.5;
      color: rgba(236, 253, 245, 0.93);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .stream-doc-term {
      margin: 8px 0;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(16, 185, 129, 0.22);
      background: rgba(7, 11, 16, 0.88);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
      color: rgba(167, 243, 208, 0.9);
    }

    .img-gen-ph {
      margin: 10px 0;
      padding: 10px 10px;
      border-radius: 10px;
      border: 1px solid var(--bd);
      background: rgba(255, 255, 255, 0.08);
    }
    @media (prefers-color-scheme: light) {
      .img-gen-ph {
        background: rgba(244, 244, 245, 0.96);
      }
    }
    .img-gen-ph-hd {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      line-height: 1.35;
      color: var(--muted);
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--bd);
    }
    @keyframes img-gen-spin {
      to {
        transform: rotate(360deg);
      }
    }
    .img-gen-spin {
      flex-shrink: 0;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 2px solid var(--bd);
      border-top-color: var(--accent);
      animation: img-gen-spin 0.8s linear infinite;
    }
    .img-gen-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      width: 100%;
    }
    .img-gen-slot {
      position: relative;
      aspect-ratio: 1;
      min-height: 74px;
      border-radius: 10px;
      border: 1px solid var(--bd);
      background: rgba(136, 146, 166, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    @media (prefers-color-scheme: light) {
      .img-gen-slot {
        background: rgba(120, 113, 108, 0.08);
      }
    }
    .img-gen-slot.on {
      box-shadow: 0 0 0 2px var(--accent-soft);
    }
    .img-gen-slot .img-ph {
      background: linear-gradient(110deg, transparent 42%, rgba(255,255,255,.34) 50%, transparent 58%);
      background-size: 220% 100%;
      animation: img-ph-shimmer 2s ease-in-out infinite;
    }
    @keyframes img-ph-shimmer {
      0% {
        background-position: 140% 0;
      }
      100% {
        background-position: -40% 0;
      }
    }
    .img-gen-slot-num {
      position: absolute;
      bottom: 5px;
      right: 5px;
      font-size: 10px;
      font-weight: 600;
      padding: 3px 6px;
      border-radius: 5px;
      background: rgba(15, 17, 23, 0.78);
      color: #e8eaef;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    @media (prefers-color-scheme: light) {
      .img-gen-slot-num {
        background: rgba(24, 24, 27, 0.75);
      }
    }
    .img-gen-slot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      cursor: zoom-in;
    }
    .msg-body a { color: var(--accent); text-decoration: underline; }
    .bubble.ast .msg-body a {
      color: inherit;
      text-decoration: underline;
      opacity: 0.92;
    }
    .msg-table-wrap {
      overflow-x: auto;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid var(--bd);
      -webkit-overflow-scrolling: touch;
    }
    .msg-table-wrap table.msg-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .msg-table-wrap th,
    .msg-table-wrap td {
      border: 1px solid var(--bd);
      padding: 6px 8px;
      text-align: left;
      vertical-align: top;
    }
    .msg-table-wrap th { background: var(--accent-soft); font-weight: 600; }

    .attach-row {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 100%;
    }
    a.attach-chip,
    button.attach-chip {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      gap: 0;
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid var(--bd);
      background: rgba(255,255,255,.05);
      text-decoration: none;
      color: var(--accent);
      line-height: 1.3;
      box-sizing: border-box;
    }
    button.attach-chip {
      appearance: none;
      font: inherit;
      cursor: pointer;
      text-align: left;
    }
    a.attach-chip .attach-name,
    button.attach-chip .attach-name {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
      flex: 1;
    }

    .imgs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-top: 8px;
    }
    @media (min-width: 480px) {
      .imgs { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    .imgs img {
      width: 100%;
      border-radius: 10px;
      background: #000;
      aspect-ratio: 1;
      object-fit: cover;
      cursor: pointer;
    }

    .composer {
      flex-shrink: 0;
      padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
      background: var(--bg-elevated);
      border-top: 1px solid var(--bd);
    }
    .composer-one {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: 8px;
      width: 100%;
      min-width: 0;
    }
    .btn-mini-att {
      flex: 0 0 42px;
      width: 42px;
      min-height: 40px;
      align-self: flex-end;
      border-radius: 10px;
      border: 1px solid var(--bd);
      background: var(--card);
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;

</head>
<body>
  <div id="drawerMask" class="drawer-mask" aria-hidden="true"></div>

  <script>
    const qs = function (s) { return document.querySelector(s); };

    /** @type {{ path: string, url: string, mtimeMs: number }[]} */
    var mediaLibItems = [];
    /** 对话里点开预览时为 false；仅图库入口打开灯箱时为 true */
    var lbAllowDelete = false;
    var lbIdx = 0;
    var lbSlideEls = null;
    /** @type {ReturnType<typeof setTimeout>|null} */
    var lbSlideTid = null;
    var currentId = null;
    var attaching = [];
    /** @type {ReturnType<typeof setInterval>|null} */
    var pollChatIv = null;
    /** 当前 thread 已渲染内容的签名；轮询时若与 state 一致则跳过整页重建，避免转圈动画被反复打断 */
    var cachedThreadRenderSig = '';
    /** 图库接口失败后用于区分「暂无」与加载失败 */
    var galleryLoadErrorMsg = '';
    /** 已成功拉取过一次图库列表时，切 tab 不再重复请求（改令牌/删图/刷新会话等会强制更新） */
    var mediaLibraryListOk = false;
    /** 图库静默刷新进行中；合并请求以避免重复打点 */
    var galleryBgPromise = null;

    var tokIn = qs('#tok');
    var sessEl = qs('#sess');
    var msgEl = qs('#msg');
    var attachNote = qs('#attachNote');
    var modelMenuBtn = qs('#modelMenuBtn');
    var modelPopover = qs('#modelPopover');
    var modelMenuLabel = qs('#modelMenuLabel');
    var cachedModelsList = [];
    var cachedActiveModelId = '';

    /** 灯箱：双指缩放 / 单指拖拽（缩放后） */
    var lbZoomScale = 1;
    var lbPanX = 0;
    var lbPanY = 0;
    var lbPinching = false;
    var lbPinchDist0 = 0;
    var lbPinchScale0 = 1;
    var lbPanningZoom = false;
    var lbPanSx = 0;
    var lbPanSy = 0;
    var lbPanOx = 0;
    var lbPanOy = 0;

    function lbTouchDist(touches) {
      var a = touches[0];
      var b = touches[1];
      var dx = a.clientX - b.clientX;
      var dy = a.clientY - b.clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function lbZoomResetHard() {
      lbZoomScale = 1;
      lbPanX = lbPanY = 0;
      lbPinching = false;
      lbPanningZoom = false;
      try {
        [].slice.call(qs('#lbTrack').querySelectorAll('.lb-slide')).forEach(function (im) {
          im.style.transform = '';
        });
      } catch (_) {}
      lbSlideEls = null;
    }

    function lbCenterImgApplyTransform() {
      if (!qs('#imgDlg').open) return;
      var imgs = lbSlides();
      if (imgs.length < 2) return;
      var mid = imgs[1];
      if (lbZoomScale <= 1.02 && Math.abs(lbPanX) < 1 && Math.abs(lbPanY) < 1) {
        lbZoomScale = 1;
        lbPanX = lbPanY = 0;
        mid.style.transform = '';
        return;
      }
      mid.style.transformOrigin = 'center center';
      mid.style.transform =
        'translate(' + lbPanX + 'px,' + lbPanY + 'px) scale(' + lbZoomScale + ')';
    }

    function closeModelMenu() {
      modelPopover.classList.add('hidden');
      modelMenuBtn.setAttribute('aria-expanded', 'false');
    }

    tokIn.value = localStorage.getItem('myagent_remote_token') || '';

    qs('#saveTok').onclick = function () {
      localStorage.setItem('myagent_remote_token', tokIn.value.trim());
      toast('已保存', 'ok');
      closeModelMenu();
      mediaLibraryListOk = false;
      void reloadModelPickerUi(true);
      void loadMediaLibrary({ force: true });
    };
    function closeDrawer() {
      qs('#drawerPanel').classList.remove('on');
      qs('#drawerMask').classList.remove('on');
      qs('#drawerPanel').setAttribute('aria-hidden', 'true');
      qs('#drawerMask').setAttribute('aria-hidden', 'true');
    }
    function openDrawer() {
      qs('#drawerPanel').classList.add('on');
      qs('#drawerMask').classList.add('on');
      qs('#drawerPanel').setAttribute('aria-hidden', 'false');
      qs('#drawerMask').setAttribute('aria-hidden', 'false');
    }
    qs('#drawerMask').onclick = closeDrawer;
    qs('#openDrawer').onclick = openDrawer;
    qs('#drawerClose').onclick = closeDrawer;

    function stopChatPoll() {
      if (pollChatIv !== null) {
        clearInterval(pollChatIv);
        pollChatIv = null;
      }
    }

    /** 远端 chat 异步执行后，轮询 state 刷新，直到 loadingSessionId 不等于当前会话或已清空（贴近桌面端流式更新） */
    function startChatPolling(sessionIdForPoll) {
      stopChatPoll();
      var deadline = Date.now() + 10 * 60 * 1000;
      var sid = sessionIdForPoll ? String(sessionIdForPoll) : '';

    function hdr() {

    /**
     * 子路径挂载/反代时，不可用 fetch('/remote/...')（会打到站点根路径变成 404）。
     * HTML 若为 https://域名/前缀/ ，接口应为 https://域名/前缀/remote/api/...
     * 壳页在 https://域名/前缀/remote 时，接口仍是 .../前缀/remote/api/...（不可拼成 .../remote/remote/api）。
     * 仅路径为 /remote 的别名入口仍以站点根作为 API 基底。
     */
    function gatewayBaseHrefDir() {
      var u = new URL(window.location.href);
      var pn = u.pathname || '/';
      var norm = pn.replace(/\/+$/, '');
      if (!norm || norm === '/') return u.origin + '/';
      if (norm.toLowerCase() === '/remote') return u.origin + '/';
      var shellRemote = /^(.*)\/remote$/i.exec(norm);
      if (shellRemote) {
        var pre = shellRemote[1] || '';
        var dir = pre ? (pre.startsWith('/') ? pre + '/' : '/' + pre + '/') : '/';
        return u.origin + dir;
      }
      return u.origin + (pn.endsWith('/') ? pn : pn + '/');
    }

    /** @param {string} rawPath 如 '/remote/api/models?x=1' */
    function resolveRemoteFetchUrl(rawPath) {
      var raw = String(rawPath || '').trim();
      if (/^https?:\/\//i.test(raw)) return raw;
      var iq = raw.indexOf('?');
      var pathPart = iq >= 0 ? raw.slice(0, iq) : raw;
      var search = iq >= 0 ? raw.slice(iq) : '';
      var tail = pathPart.startsWith('/') ? pathPart.slice(1) : pathPart;
      try {
        return new URL(tail + search, gatewayBaseHrefDir()).href;
      } catch (_) {
        return pathPart + search;
      }
    }

    function toast(t, kind) {
      if (kind !== 'err') {
        qs('#toast').innerHTML = '';
        return;
      }
      qs('#toast').innerHTML = '<div class="toast err">' + esc(t) + '</div>';
    }

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
    }

    function escAttr(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/'/g, '&#39;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;');
    }

    function normalizeDiskPathFromHref(raw) {
      var h = String(raw || '').trim();
      if (!h) return '';
      if (/^local-file:/i.test(h)) {
        try {
          var tail = h.replace(/^local-file:\/*/i, '');
          return decodeURIComponent(tail);
        } catch (_) {
          return '';
        }
      }
      if (/^file:/i.test(h)) {
        try {
          var u = new URL(h);
          var pn = u.pathname;
          return decodeURIComponent(/^\/([A-Za-z]:)/.test(pn) ? pn.slice(1) : pn);
        } catch (_) {
          return '';
        }
      }
      if (h.indexOf('://') < 0 && /^(\/|[A-Za-z]:[\\/])/.test(h)) return h;
      return '';
    }

    function rewriteHrefForRemote(hrefRaw) {
      if (/^https?:\/\//i.test(hrefRaw)) return hrefRaw;
      var p = normalizeDiskPathFromHref(hrefRaw);
      if (p) return mediaUrl(p);
      return '';
    }

    function linkifyMdFragment(s) {
      if (!s) return '';
      var re = /\[([^\]]+)\]\(([^)]+)\)/g;
      var i = 0;
      var out = '';
      var m;
      while ((m = re.exec(s)) !== null) {
        out += esc(s.slice(i, m.index)).replace(/\n/g, '<br>');
        var lab = esc(m[1]);
        var hrefRaw = m[2].trim();
        var href = rewriteHrefForRemote(hrefRaw);
        if (href) {
          var ext = /^https?:\/\//i.test(hrefRaw);
        var isFileApi =
          !ext && (href.indexOf('/remote/api/file') >= 0 || href.indexOf('remote/api/file') >= 0);
          out +=
            '<a href="' +
            escAttr(href) +
            '" class="' +
            (isFileApi ? 'msg-file-link' : '') +
            '"' +
            (ext ? ' target="_blank" rel="noopener noreferrer"' : '') +
            '>' +
            lab +
            '</a>';
        } else {
          out += '<span title="不可从此页打开">' + lab + '</span>';
        }
        i = re.lastIndex;
      }
      out += esc(s.slice(i)).replace(/\n/g, '<br>');
      return out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    }

    function isTableSepLine(line) {
      var t = line.trim();
      return /^\|[\s\-:|]+\|/.test(t) || (/^\|/.test(t) && /-/.test(t) && /\|/.test(t));
    }

    function isPipeTableLine(line) {
      var t = line.trim();
      if (!t || t.indexOf('|') < 0) return false;
      return t.split('|').length >= 2;
    }

    function splitMarkdownWithTables(md) {
      var lines = String(md || '').split(/\r?\n/);
      var out = [];
      var buf = [];
      function flushText() {
        if (buf.length) {
          out.push({ type: 'text', text: buf.join('\n') });
          buf = [];
        }
      }
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        var next = lines[i + 1];
        if (next !== undefined && isPipeTableLine(line) && isTableSepLine(next)) {
          flushText();
          var tbl = [];
          while (i < lines.length && isPipeTableLine(lines[i])) {
            tbl.push(lines[i]);
            i++;
          }
          i--;
          out.push({ type: 'table', lines: tbl });
          continue;
        }
        buf.push(line);
      }
      flushText();
      return out;
    }

    function parseTableRowCells(line) {
      var t = line.trim();
      if (t.startsWith('|')) t = t.slice(1);
      if (t.endsWith('|')) t = t.slice(0, -1);
      return t.split('|').map(function (c) {
        return c.trim();
      });
    }

    function tableLinesToHtml(lines) {
      if (!lines || !lines.length) return '';
      var sepIdx = -1;
      for (var si = 0; si < lines.length; si++) {
        if (isTableSepLine(lines[si])) {
          sepIdx = si;
          break;
        }
      }
      if (sepIdx < 0 || sepIdx > lines.length - 1) {
        return '';
      }
      var headCells = parseTableRowCells(lines[0]);
      var bodyStart = sepIdx + 1;
      var html = '<div class="msg-table-wrap"><table class="msg-table"><thead><tr>';
      headCells.forEach(function (c) {
        html += '<th>' + linkifyMdFragment(c) + '</th>';
      });
      html += '</tr></thead><tbody>';
      for (var r = bodyStart; r < lines.length; r++) {
        if (!lines[r].trim()) continue;
        var cells = parseTableRowCells(lines[r]);
        html += '<tr>';
        cells.forEach(function (c) {
          html += '<td>' + linkifyMdFragment(c) + '</td>';
        });
        html += '</tr>';
      }
      html += '</tbody></table></div>';
      return html;
    }

    function renderAssistantBodies(content) {
      var raw = content == null ? '' : String(content);
      var chunks = splitMarkdownWithTables(raw);
      var frag = '';
      chunks.forEach(function (ch) {
        if (ch.type === 'text') {
          frag += '<div class="msg-body">' + linkifyMdFragment(ch.text) + '</div>';
        } else if (ch.type === 'table') {
          frag += tableLinesToHtml(ch.lines);
        }
      });
      return frag || '<div class="msg-body">' + linkifyMdFragment(raw) + '</div>';
    }

    /** @param {HTMLElement} el @param {{ id: string, content: string, role: string }} payload */
    function armBubbleLongPress(el, payload) {
      var tTouch = null;
      var tMouse = null;
      var sx = 0;
      var sy = 0;
      var mx = 0;
      var my = 0;

      function clearTouchTimer() {
        if (tTouch) {
          clearTimeout(tTouch);
          tTouch = null;
        }
      }
      function clearMouseTimer() {
        if (tMouse) {
          clearTimeout(tMouse);
          tMouse = null;
        }
      }

      el.addEventListener(
        'touchstart',
        function (ev) {
          if (!payload.id) return;
          clearTouchTimer();
          var te = ev.changedTouches && ev.changedTouches[0];
          sx = te ? te.clientX : 0;
          sy = te ? te.clientY : 0;
          tTouch = setTimeout(function () {
            tTouch = null;
            openMsgCtx(payload);
          }, 500);
        },
        { passive: true }
      );
      el.addEventListener('touchmove', function (ev) {
        if (!tTouch) return;
        var te = ev.changedTouches && ev.changedTouches[0];
        if (te && (Math.abs(te.clientX - sx) > 12 || Math.abs(te.clientY - sy) > 12)) clearTouchTimer();
      });
      el.addEventListener('touchend', clearTouchTimer);
      el.addEventListener('touchcancel', clearTouchTimer);

      el.addEventListener('contextmenu', function (ev) {
        if (!payload.id) return;
        ev.preventDefault();
        clearTouchTimer();
        clearMouseTimer();
        openMsgCtx(payload);
      });

      el.addEventListener('mousedown', function (ev) {
        if (ev.button !== 0 || !payload.id) return;
        clearMouseTimer();
        mx = ev.clientX;
        my = ev.clientY;
        tMouse = setTimeout(function () {
          tMouse = null;
          openMsgCtx(payload);
        }, 550);
      });
      el.addEventListener('mouseup', clearMouseTimer);
      el.addEventListener('mouseleave', clearMouseTimer);
      el.addEventListener('mousemove', function (ev) {
        if (!tMouse) return;
        if (Math.abs(ev.clientX - mx) > 10 || Math.abs(ev.clientY - my) > 10) clearMouseTimer();
      });
    }

    function parseFilenameFromContentDisposition(hdr) {
      var h = String(hdr || '');
      var mAst = /\bfilename\*=UTF-8''([^;\s]+)/i.exec(h);
      if (mAst) {
        try {
          return decodeURIComponent(mAst[1].replace(/\"/g, ''));
        } catch (_) {
          return '';
        }
      }
      var mQ = /\bfilename="([^"]+)"/i.exec(h);
      if (mQ) return mQ[1];
      var mNQ = /\bfilename=([^;\s]+)/i.exec(h);
      return mNQ ? mNQ[1].trim() : '';
    }

    async function fetchRemoteFileBlob(pathWithQuery) {
      var pq = String(pathWithQuery || '').trim();
      if (pq.indexOf('/') !== 0) pq = '/' + pq.replace(/^\/+/, '');
      var tok = tokIn.value.trim();
      var h = {};
      if (tok) h.Authorization = 'Bearer ' + tok;
      var r = await fetch(resolveRemoteFetchUrl(pq), { headers: h });
      var ctFull = r.headers.get('Content-Type') || '';
      var ab = await r.arrayBuffer();
      if (!r.ok) {
        var tip = '';
        try {
          if (ctFull.indexOf('json') >= 0) {
            var j = JSON.parse(new TextDecoder().decode(ab));
            tip = j && j.error ? String(j.error) : '';
          } else {
            tip = new TextDecoder().decode(ab).slice(0, 180);
          }
        } catch (_) {}
        throw new Error((String(r.status) + (tip ? ' — ' + tip : '')).trim());
      }
      var mimeSimple = ctFull.split(';')[0].trim() || 'application/octet-stream';
      return {
        blob: new Blob([ab], { type: mimeSimple }),
        contentType: ctFull,
        contentDisposition: r.headers.get('Content-Disposition'),
      };
    }

    async function openOrDownloadRemoteFile(pathWithQuery, displayName) {
      try {
        var got = await fetchRemoteFileBlob(pathWithQuery);
        var fname =
          parseFilenameFromContentDisposition(got.contentDisposition || '') ||
          (displayName && String(displayName).trim()) ||
          '附件';
        var mimeSimple = got.blob.type || '';
        var preview = mimeLooksPreview(mimeSimple);
        var u = URL.createObjectURL(got.blob);
        if (preview) {
          window.open(u, '_blank', 'noopener,noreferrer');
          setTimeout(function () {
            URL.revokeObjectURL(u);
          }, 180000);
        } else {
          var a = document.createElement('a');
          a.href = u;
          a.download = fname;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(function () {
            URL.revokeObjectURL(u);
          }, 5000);
        }
      } catch (err) {
        toast(String(err && err.message ? err.message : err), 'err');
      }
    }

    function openLightboxFromLibPath(absPathOrEmpty, fallbackList, fallbackIdx) {
      var mapped = (fallbackList || []).map(function (x) {
        return {

          absPath:
            typeof x.absPath === 'string' && x.absPath.length > 0 ? x.absPath : null,

    (function lbTouchNav() {
      var sx = null;
      var sy = null;
      var tracking = false;
      var w = 0;
      var vp = qs('#lbViewport');

      function pinchEndMaybe() {
        if (lbZoomScale < 1.05 && !lbPanningZoom) {
          lbZoomScale = 1;
          lbPanX = lbPanY = 0;
          lbCenterImgApplyTransform();
        }
      }

      vp.addEventListener(
        'touchstart',
        function (e) {
          if (!qs('#imgDlg').open) return;
          var n = e.touches.length;
          if (n === 2) {
            e.preventDefault();
            window.clearTimeout(lbSlideTid);
            lbPinching = true;
            tracking = false;
            lbPanningZoom = false;
            sx = null;
            lbPinchDist0 = Math.max(12, lbTouchDist(e.touches));
            lbPinchScale0 = lbZoomScale;
            qs('#lbTrack').classList.add('lb-no-anim');
            return;
          }
          if (n === 1 && lbZoomScale > 1.03) {
            window.clearTimeout(lbSlideTid);
            lbPanningZoom = true;
            tracking = false;
            lbPinching = false;
            sx = null;
            lbPanSx = e.touches[0].clientX;
            lbPanSy = e.touches[0].clientY;
            lbPanOx = lbPanX;
            lbPanOy = lbPanY;
            qs('#lbTrack').classList.add('lb-no-anim');
            e.preventDefault();
            return;
          }
          if (!e.touches || n !== 1 || lbZoomScale > 1.03) {
            sx = null;
            return;
          }
          if (lbList.length < 2) return;
          window.clearTimeout(lbSlideTid);
          lbPanningZoom = false;
          lbPinching = false;
          sx = e.touches[0].clientX;
          sy = e.touches[0].clientY;
          tracking = true;
          w = lbStageW();
          qs('#lbTrack').classList.add('lb-no-anim');
        },
        { passive: false }
      );

      vp.addEventListener(
        'touchmove',
        function (e) {
          if (!qs('#imgDlg').open) return;
          var n = e.touches.length;
          if (lbPinching && n >= 2) {
            e.preventDefault();
            var d = Math.max(14, lbTouchDist(e.touches));
            var ratio = d / lbPinchDist0;
            lbZoomScale = Math.min(5, Math.max(1, lbPinchScale0 * ratio));
            lbCenterImgApplyTransform();
            return;
          }
          if (lbPanningZoom && n === 1) {
            e.preventDefault();
            lbPanX =
              lbPanOx + (e.touches[0].clientX - lbPanSx);
            lbPanY =
              lbPanOy + (e.touches[0].clientY - lbPanSy);
            lbCenterImgApplyTransform();
            return;
          }
          if (!tracking || sx === null || !e.touches || e.touches.length !== 1) return;
          var x = e.touches[0].clientX;
          var y = e.touches[0].clientY;
          var dx = x - sx;
          var dy = y - sy;
          if (Math.abs(dy) > Math.abs(dx) + 22) {
            tracking = false;
            sx = null;
            lbSnapCenterNoAnim();
            return;
          }
          e.preventDefault();
          var baseX = -w;
          var nx = baseX + dx;
          nx = Math.max(-2 * w, Math.min(0, nx));
          lbTrackSetX(nx);
        },
        { passive: false }
      );

      vp.addEventListener(
        'touchcancel',
        function () {
          if (lbPinching) {
            lbPinching = false;
            pinchEndMaybe();
            return;
          }
          if (lbPanningZoom) {
            lbPanningZoom = false;
            return;
          }
          if (!tracking) return;
          tracking = false;
          sx = null;
          lbSnapCenterNoAnim();
        },
        { passive: true }
      );

      vp.addEventListener(
        'touchend',
        function (e) {
          if (!qs('#imgDlg').open) return;
          if (lbPinching && e.touches.length < 2) {
            lbPinching = false;
            pinchEndMaybe();
          }
          if (lbPanningZoom) {
            if (e.touches.length === 0) lbPanningZoom = false;
            return;
          }
          if (!tracking) return;
          tracking = false;
          qs('#lbTrack').classList.remove('lb-no-anim');
          if (sx == null || !e.changedTouches || !e.changedTouches.length) return;
          var dx = e.changedTouches[0].clientX - sx;
          sx = null;
          var wNow = lbStageW();
          var threshold = Math.min(72, Math.max(44, Math.floor(wNow * 0.14)));
          if (dx < -threshold) lbDragFinish(1);
          else if (dx > threshold) lbDragFinish(-1);
          else lbAnimateSnapCenter();
        },
        { passive: true }
      );
    })();

    async function api(path, opt) {
      opt = opt || {};
      var merged = Object.assign({}, opt);
      merged.headers = Object.assign({}, hdr(), (opt && opt.headers) || {});
      var urlStr = resolveRemoteFetchUrl(path);
      var methodUp = String(merged.method || 'GET').toUpperCase();
      if (
        methodUp === 'GET' &&
        /remote\/api\/(?:models|media-library|state|meta)\b/i.test(urlStr)
      ) {
        merged.cache = 'no-store';
      }
      var r = await fetch(urlStr, merged);
      var raw = await r.text();
      var j = {};
      if (raw) {
        try {
          j = JSON.parse(raw);
        } catch (_) {
          /**/
        }
      }
      if (!r.ok) {
        var extra = j && j.error ? String(j.error) : raw.slice(0, 220);
        var msg = (String(r.status) + ' ' + r.statusText + (extra ? ' — ' + extra : '')).trim();
        if (r.status === 401) msg = '未授权：请在侧栏粘贴与桌面远端网关一致的访问令牌后再试。';
        else if (r.status === 404)
          msg =
            '请求 404（' +
            msg +
            '）。若网关挂在子路径或通过反代访问，浏览器会走错 API 路径；也可用「电脑 IP:网关端口」直开远端页试一下。';
        throw new Error(msg);
      }
      return j;
    }

    function threadSigSessionPayload() {
      var ordered = sortSessions((window.__lastState && window.__lastState.sessions) || []);
      var d =
        ordered.find(function (x) {
          return x.id === currentId;
        }) || null;
      if (!d && ordered[0]) d = ordered[0];
      return d;
    }

    function computeThreadRenderSig() {
      var st = window.__lastState;
      var lid = st && st.loadingSessionId != null ? String(st.loadingSessionId) : '';
      var d = threadSigSessionPayload();
      if (!d) return 'empty|' + String(currentId || '') + '|' + lid;
      var parts = [
        String(d.id),
        String(currentId || ''),
        lid,
        String((d.messages || []).length),
      ];
      var msgs = d.messages || [];
      for (var mi = 0; mi < msgs.length; mi++) {
        var m = msgs[mi];
        var ig = m.imageGenProgress;
        var igStr = '0';
        if (ig && typeof ig.total === 'number') {
          igStr =
            String(ig.total) +
            '/' +
            String(ig.done != null ? ig.done : '') +
            '/' +
            String(ig.phase || '');
        }
        var xh = m.exportHint;
        var xhStr = '';
        if (xh && xh.document) xhStr = 'doc:' + String(xh.document.status || '');
        var files = m.files || [];
        var fileBits = String(files.length);
        for (var fi = 0; fi < files.length; fi++) {
          var f = files[fi];
          fileBits += ',' + String(f.path || '') + ',' + String(f.name || '');
        }
        parts.push(
          String(m.id || '') +
            ':' +
            String(m.role || '') +
            ':' +
            String((m.content || '').length) +
            ':' +
            String((m.reasoning || '').length) +
            ':' +
            fileBits +
            ':' +
            igStr +
            ':' +
            xhStr
        );
      }
      return parts.join('\n');
    }

    /**
     * @param {'bottom' | 'preserve'} mode
     * @param {{ nearBottom: boolean, distFromBottom: number }} [preserveCtx]
     */
    function applyThreadScrollAfterRender(mode, preserveCtx) {
      var thread = qs('#thread');
      var run = function () {
        if (mode === 'bottom') {
          thread.scrollTop = thread.scrollHeight;
          return;
        }
        var ctx = preserveCtx || { nearBottom: true, distFromBottom: 0 };
        if (ctx.nearBottom) {
          thread.scrollTop = thread.scrollHeight;
        } else {
          var maxScroll = Math.max(0, thread.scrollHeight - thread.clientHeight);
          var t = Math.max(0, maxScroll - ctx.distFromBottom);
          thread.scrollTop = Math.min(t, maxScroll);
        }
      };
      requestAnimationFrame(function () {
        run();
        requestAnimationFrame(run);
      });
    }

    /** @param {boolean|{ force?: boolean, scroll?: 'bottom' | 'preserve' }} [opt] */
    function renderThread(opt) {
      var opts = {};
      if (opt === true) opts.force = true;
      else if (opt && typeof opt === 'object') opts = opt;
      var force = !!opts.force;
      var scrollMode = opts.scroll === 'bottom' ? 'bottom' : 'preserve';

      var thread = qs('#thread');
      if (!force) {
        var sigProbe = computeThreadRenderSig();
        if (sigProbe === cachedThreadRenderSig && thread.children.length > 0) {
          return;
        }
      }

      var nearBottom = true;
      var distFromBottom = 0;
      if (scrollMode === 'preserve') {
        var sh0 = thread.scrollHeight;
        var ch0 = thread.clientHeight || 0;
        var st0 = thread.scrollTop;
        distFromBottom = Math.max(0, sh0 - ch0 - st0);
        nearBottom = distFromBottom <= 80;
      }

      var ordered = sortSessions((window.__lastState && window.__lastState.sessions) || []);
      var d =
        ordered.find(function (x) {
          return x.id === currentId;
        }) || null;
      if (!d && ordered[0]) d = ordered[0];
      thread.innerHTML = '';
      if (!d) {
        thread.innerHTML = '<div class="toast" style="border-style:dashed">无会话</div>';
        refreshMediaLibBadge();
        cachedThreadRenderSig = computeThreadRenderSig();
        scrollThreadToBottom();
        return;
      }
      var msgImagesFallback = [];

      function pushFallback(url, libAbsPath) {
        if (!url) return -1;
        msgImagesFallback.push({
          url: url,
          absPath: typeof libAbsPath === 'string' && libAbsPath ? libAbsPath : '',
        });
        return msgImagesFallback.length - 1;
      }

      var sessionMessages = d.messages || [];
      var lastMsgIx = sessionMessages.length - 1;
      var loadingSid =
        window.__lastState && window.__lastState.loadingSessionId != null
          ? String(window.__lastState.loadingSessionId)
          : '';
      var thisSessionStreaming = !!(loadingSid && String(d.id) === loadingSid);

      /** 助手消息是否已有可展示内容（避免空占位 + 底部「三点」双气泡） */
      function assistantMessageHasVisibleUi(m) {
        if (!m || m.role !== 'assistant') return true;
        var hasFf = ((m.files || []).length || 0) > 0;
        var ct0 = String(m.content || '').trim();
        if (ct0) return true;
        if (String(m.reasoning || '').trim()) return true;
        if (hasFf) return true;
        var xh = m.exportHint;
        if (xh && xh.document && xh.document.status === 'thinking' && !hasFf && !ct0) return true;
        if (xh && xh.document && xh.document.status === 'generating' && !hasFf) return true;
        var ig = m.imageGenProgress;
        if (ig && typeof ig.total === 'number' && ig.total >= 1) return true;
        return false;
      }

      sessionMessages.forEach(function (m, idx) {
        if (
          thisSessionStreaming &&
          idx === lastMsgIx &&
          m.role === 'assistant' &&
          !assistantMessageHasVisibleUi(m)
        ) {
          return;
        }

        var isUser = m.role === 'user';
        var isSystem = m.role === 'system';
        var wrap = document.createElement('div');
        wrap.className = 'bubble-wrap ' + (isUser ? 'align-user' : 'align-ast');

        var role = document.createElement('div');
        role.className = 'msg-role-out ' + (isUser ? 'out-user' : 'out-ast');
        role.textContent = isUser ? '我' : '助手';
        wrap.appendChild(role);

        var b = document.createElement('div');
        b.className = 'bubble ' + (isUser ? 'user' : 'ast');

        var bodyHost = document.createElement('div');
        if (isUser || isSystem) {
          bodyHost.innerHTML =
            '<div class="msg-body">' + linkifyMdFragment(m.content || '') + '</div>';
        } else {
          bodyHost.innerHTML = renderAssistantBodies(m.content || '');
        }

        var thought = typeof m.reasoning === 'string' && m.reasoning.trim();
        if (thought) {
          var det = document.createElement('details');
          det.className = 'msg-thought';
          det.open =
            !!(thisSessionStreaming && idx === lastMsgIx && !isUser && !isSystem && m.role === 'assistant');
          var sm = document.createElement('summary');
          sm.textContent = '思维过程';
          det.appendChild(sm);
          var pre = document.createElement('div');
          pre.className = 'thought-pre';
          pre.textContent = m.reasoning;
          det.appendChild(pre);
          b.appendChild(det);
        }
        if (!isUser && !isSystem && m.role === 'assistant') {
          var xh = m.exportHint;
          var hasFf = ((m.files || []).length || 0) > 0;
          var ct0 = String(m.content || '').trim();
          var docThinking = xh && xh.document && xh.status === 'thinking' && !hasFf && !ct0;
          var docGen = xh && xh.document && xh.status === 'generating' && !hasFf;
          if (docThinking || docGen) {
            var dt = document.createElement('div');
            dt.className = 'stream-doc-term';
            dt.textContent = docGen ? '▸ 正在写入文档（md/docx）…' : '> 正在流式起草文档…';
            b.appendChild(dt);
          }
        }

        var files = m.files || [];
        var imgs = files.filter(function (f) {
          return f.type && f.type.indexOf('image/') === 0;
        });
        var docs = files.filter(function (f) {
          return !f.type || f.type.indexOf('image/') !== 0;
        });
        var igProg = !isUser && !isSystem && m.role === 'assistant' ? m.imageGenProgress : null;
        var showImgGenPh =
          !!(igProg && typeof igProg.total === 'number' && igProg.total >= 1);
        var imgSlotTotal = showImgGenPh ? Math.min(Math.max(igProg.total, 1), 24) : 0;

        b.appendChild(bodyHost);

        if (showImgGenPh && imgSlotTotal > 0) {
          var phWrap = document.createElement('div');
          phWrap.className = 'img-gen-ph';
          var phHd = document.createElement('div');
          phHd.className = 'img-gen-ph-hd';
          var spr = document.createElement('span');
          spr.className = 'img-gen-spin';
          phHd.appendChild(spr);
          var labHd = document.createElement('span');
          labHd.textContent =
            imgSlotTotal > 1 ? '正在生成图像（共 ' + imgSlotTotal + ' 张）…' : '正在生成图像…';
          phHd.appendChild(labHd);
          phWrap.appendChild(phHd);
          var gr = document.createElement('div');
          gr.className = 'img-gen-grid';
          var nLoadedSlots = imgs.length;
          var _si;
          for (_si = 0; _si < imgSlotTotal; _si++) {
            var sl = document.createElement('div');
            sl.className = 'img-gen-slot';
            var fhere = imgs[_si];
            if (fhere) {
              var _uhere = fileToImageUrl(fhere);
              if (_uhere) {
                var _pk = typeof fhere.path === 'string' ? fhere.path : '';
                var _ixFb = pushFallback(_uhere, _pk);
                var him = document.createElement('img');
                him.src = _uhere;
                him.alt = fhere.name || '';
                (function (pathKey, fbIx) {
                  him.onclick = function () {
                    openLightboxFromLibPath(pathKey, msgImagesFallback, fbIx);
                  };
                })(_pk, _ixFb);
                sl.appendChild(him);
              }
            } else {
              if (_si === nLoadedSlots) sl.classList.add('on');
              var shim = document.createElement('div');
              shim.className = 'img-ph';
              shim.setAttribute(
                'style',
                'position:absolute;inset:0;pointer-events:none;opacity:.5;border-radius:inherit'
              );
              sl.appendChild(shim);
              if (_si === nLoadedSlots) {
                var ld = document.createElement('div');
                ld.className = 'img-gen-spin';
                sl.appendChild(ld);
              } else {
                var phIc = document.createElement('span');
                phIc.setAttribute('aria-hidden', 'true');
                phIc.textContent = '\u25A3';
                phIc.style.cssText =
                  'position:relative;z-index:2;font-size:17px;line-height:1;font-weight:600;opacity:0.42;color:var(--muted)';
                sl.appendChild(phIc);
              }
            }
            var sn = document.createElement('span');
            sn.className = 'img-gen-slot-num';
            sn.textContent = _si + 1 + '/' + imgSlotTotal;
            sl.appendChild(sn);
            gr.appendChild(sl);
          }
          phWrap.appendChild(gr);
          b.appendChild(phWrap);
        }
        if (docs.length) {
          var row = document.createElement('div');
          row.className = 'attach-row';
          docs.forEach(function (f) {
            if (!f.path) return;
            var fn = f.name || '附件';
            var url = mediaUrl(f.path);
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'attach-chip';
            btn.title = fn;
            var sp = document.createElement('span');
            sp.className = 'attach-name';
            sp.textContent = fn;
            btn.appendChild(sp);
            btn.onclick = function () {
              void openOrDownloadRemoteFile(url, fn);
            };
            row.appendChild(btn);
          });
          b.appendChild(row);
        }

        if (imgs.length && !showImgGenPh) {
          var g = document.createElement('div');
          g.className = 'imgs';
          imgs.forEach(function (f) {
            var u = fileToImageUrl(f);
            if (!u) return;
            var pathKey = typeof f.path === 'string' ? f.path : '';
            var ixFb = pushFallback(u, pathKey);
            var im = document.createElement('img');
            im.src = u;
            im.onclick = function () {
              openLightboxFromLibPath(pathKey, msgImagesFallback, ixFb);
            };
            g.appendChild(im);
          });
          b.appendChild(g);
        }

        wrap.appendChild(b);
        if (m.id) {
          armBubbleLongPress(b, {
            id: String(m.id),
            content: String(m.content == null ? '' : m.content),
            role: String(m.role || ''),
          });
        }
        thread.appendChild(wrap);
      });

      if (sessionMessages.length) {
        var waitingAssistant = false;
        if (thisSessionStreaming) {
          var Ll = sessionMessages[sessionMessages.length - 1];
          if (Ll.role === 'user') {
            waitingAssistant = true;
          } else if (Ll.role === 'assistant') {
            if (!assistantMessageHasVisibleUi(Ll)) waitingAssistant = true;
          }
        }
        if (waitingAssistant) {
          var twRow = document.createElement('div');
          twRow.className = 'bubble-wrap align-ast';
          var roleTy = document.createElement('div');
          roleTy.className = 'msg-role-out out-ast';
          roleTy.textContent = '助手';
          twRow.appendChild(roleTy);
          var bubTy = document.createElement('div');
          bubTy.className = 'bubble ast typing-wait-bubble';
          bubTy.setAttribute('aria-busy', 'true');
          bubTy.innerHTML =
            '<div class="remote-type-dots" role="status" aria-live="polite">' +
            '<span></span><span></span><span></span>' +
            '</div>';
          twRow.appendChild(bubTy);
          thread.appendChild(twRow);
        }
      }

      refreshMediaLibBadge();
      cachedThreadRenderSig = computeThreadRenderSig();
      applyThreadScrollAfterRender(scrollMode, { nearBottom: nearBottom, distFromBottom: distFromBottom });

      var panelG = qs('#panel-gallery');
      if (panelG.classList.contains('active')) renderGallery({ reuseDom: true });
    }

    function renderSessionsUI() {
      var st = window.__lastState;
      sessEl.innerHTML = '';
      if (!st || !(st.sessions || []).length) return;
      var ordered = sortSessions(st.sessions);
      ordered.forEach(function (s) {
        var n = document.createElement('button');
        n.type = 'button';
        n.className = 'sess-card' + (s.id === currentId ? ' on' : '');
        var t = document.createElement('div');
        t.className = 'sess-card-title';
        t.textContent = s.title || '未命名';
        n.appendChild(t);
        var meta = document.createElement('div');
        meta.className = 'sess-card-meta';
        meta.appendChild(document.createTextNode(fmtShortTime(s.updatedAt)));
        if (s.unread) {
          var dot = document.createElement('span');
          dot.className = 'pill-unread';
          dot.setAttribute('aria-label', '未读');
          n.appendChild(dot);
        }
        n.appendChild(meta);
        n.onclick = function () {
          void (async function () {
            try {
              await activateSessionDesktop(s.id);
              currentId = s.id;
              await loadSessions();
              closeDrawer();
            } catch (e) {
              toast(String(e.message || e), 'err');
            }
          })();
        };
        sessEl.appendChild(n);
      });
    }

    function setTab(which) {
      qs('#panel-chat').classList.toggle('active', which === 'chat');
      qs('#panel-gallery').classList.toggle('active', which === 'gallery');
      qs('.tabbar button[data-tab="chat"]').classList.toggle('on', which === 'chat');
      qs('.tabbar button[data-tab="gallery"]').classList.toggle('on', which === 'gallery');
      if (which === 'gallery') {
        refreshMediaLibBadge();
        if (mediaLibItems.length || galleryLoadErrorMsg) {
          renderGallery({ reuseDom: !!mediaLibraryListOk && mediaLibItems.length > 0 });
        }
        void loadMediaLibrary(mediaLibraryListOk ? { background: true } : {});
      }
      if (which === 'chat') scrollThreadToBottom();
    }

    qs('.tabbar').querySelectorAll('button[data-tab]').forEach(function (b) {
      b.onclick = function () {
        setTab(b.getAttribute('data-tab'));
      };
    });

    async function loadSessions() {
      try {
        await reloadModelPickerUi(true);
        var d = await api('/remote/api/state', { method: 'GET' });
        window.__lastState = d;
        currentId = d.currentSessionId || null;
        renderSessionsUI();
        if (
          currentId &&
          !(d.sessions || []).some(function (x) {
            return x.id === currentId;
          })
        ) {
          currentId = (d.sessions && d.sessions[0] && d.sessions[0].id) || null;
        }
        if (!currentId && d.sessions && d.sessions[0]) {
          currentId = d.sessions[0].id;
        }
        renderThread({ force: true, scroll: 'bottom' });
        await loadMediaLibrary({ force: true });
      } catch (e) {
        toast(String(e.message || e), 'err');
      }
    }

    async function newSession() {
      closeDrawer();
      try {
        var d = await api('/remote/api/session', { method: 'POST' });
        currentId = d.sessionId;
        toast('已创建', 'ok');
        await activateSessionDesktop(currentId);
        await loadSessions();
      } catch (e) {
        toast(String(e.message || e), 'err');
      }
    }

    qs('#reload').onclick = loadSessions;
    qs('#newSesDrawer').onclick = newSession;

    qs('#pick').onclick = function () {
      qs('#file').click();
    };
    qs('#file').onchange = function (e) {
      void attachFiles(e.target.files);
      e.target.value = '';
    };

    /** @param {FileList|null} fl */
    async function attachFiles(fl) {
      if (!fl || !fl.length) {
        attaching = [];
        syncAttachNote();
        return;
      }
      var fd = new FormData();
      [].slice.call(fl).forEach(function (f) {
        fd.append('f', f);
      });
      var tok = tokIn.value.trim();
      try {
        var r = await fetch(resolveRemoteFetchUrl('/remote/api/upload'), {
          method: 'POST',
          headers: tok ? { Authorization: 'Bearer ' + tok } : {},
          body: fd,
        });
        var j = await r.json().catch(function () {
          return {};
        });
        if (!r.ok) throw new Error(j.error || '上传失败');
        attaching = attaching.concat(j.files || []);
        syncAttachNote();
      } catch (err) {
        toast(String(err.message || err), 'err');
      }
    }

    async function send() {
      if (!currentId) {
        toast('请先选会话或新建', 'err');
        return;
      }
      var sidStable = currentId;
      try {
        var body = {
          sessionId: sidStable,
          content: msgEl.value.trim(),
          attachments: attaching.map(function (f) {
            return { path: f.path, name: f.name, type: f.type, size: f.size };
          }),
        };
        attaching = [];
        syncAttachNote();
        var r = await fetch(resolveRemoteFetchUrl('/remote/api/chat'), {
          method: 'POST',
          headers: Object.assign({}, hdr()),
          body: JSON.stringify(body),
        });
        var j = await r.json().catch(function () {
          return {};
        });
        if (!r.ok) throw new Error(j.error || String(r.status));
        msgEl.value = '';
        window.__lastState = await api('/remote/api/state', { method: 'GET' });
        renderSessionsUI();
        renderThread({ force: true, scroll: 'bottom' });
        startChatPolling(sidStable);
      } catch (e) {
        toast(String(e.message || e), 'err');
      }
    }
    qs('#send').onclick = function () {
      void send();
    };

    qs('#thread').addEventListener('click', function (ev) {
      var t = ev.target;
      if (!t || !t.closest) return;
      var a = t.closest('a.msg-file-link');
      if (!a) a = t.closest('a[href*="/remote/api/file"]');
      if (!a || !qs('#thread').contains(a)) return;
      var pq = threadHrefToApiFileQuery(a.getAttribute('href'));
      if (!pq) return;
      ev.preventDefault();
      var lab = (a.textContent || '').trim() || '附件';
      void openOrDownloadRemoteFile(pq, lab);
    });

    qs('#thread').addEventListener('selectstart', function (ev) {
      var t = ev.target;
      if (t && t.closest && t.closest('.bubble')) ev.preventDefault();
    });

    qs('#msgCtxMask').onclick = closeMsgCtx;
    qs('#msgCtxCancel').onclick = closeMsgCtx;
    qs('#msgCtxCopy').onclick = function () {
      if (!msgCtxPending) return;
      var c = msgCtxPending.content;
      void clipboardWriteMaybe(c).then(function () {
        closeMsgCtx();
      });
    };
    qs('#msgCtxDel').onclick = function () {
      if (!msgCtxPending) return;
      if (!confirm('删除这条消息？')) return;
      var id = msgCtxPending.id;
      closeMsgCtx();
      void apiRemoveMessages([id]);
    };
    qs('#msgCtxEdit').onclick = function () {
      if (!msgCtxPending) return;
      var id = msgCtxPending.id;
      var c = msgCtxPending.content;
      closeMsgCtx();
      var dlg = qs('#editMsgDlg');
      dlg.setAttribute('data-msg-id', id);
      qs('#editMsgTa').value = c;
      dlg.showModal();
    };
    qs('#editMsgCancel').onclick = function () {
      qs('#editMsgTa').blur();
      qs('#editMsgDlg').close();
    };
    qs('#editMsgSave').onclick = function () {
      var dlg = qs('#editMsgDlg');
      var id = dlg.getAttribute('data-msg-id') || '';
      var nv = qs('#editMsgTa').value;
      if (!id || !String(nv).trim()) {
        toast('请输入要发送的内容', 'err');
        return;
      }
      dlg.removeAttribute('data-msg-id');
      qs('#editMsgTa').blur();
      dlg.close();
      void apiResubmitEditedUserMessage(id, nv);
    };
    qs('#editMsgDlg').addEventListener('close', function () {
      qs('#editMsgTa').blur();
    });

    syncAttachNote();
    loadSessions();
  </script>
</body>
</html>
