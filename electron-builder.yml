appId: com.myagent.app
productName: MyAgent
directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - dist-electron/**/*
  - resources/**/*

extraResources:
  # 手势识别模型不能塞进 asar（FilesetResolver 需要可访问的 file:// 路径），
  # 解到 Contents/Resources/models/，主进程通过 process.resourcesPath 找到它
  - from: resources/models
    to: models
    filter:
      - '**/*'

mac:
  extendInfo:
    NSMicrophoneUsageDescription: MyAgent 需要使用麦克风，将语音转为输入框文字。
    NSCameraUsageDescription: MyAgent 需要使用摄像头，识别你的手势以驱动对话区粒子动画；所有识别在本机进行，不会上传任何画面。
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  icon: resources/icon.png

win:
  target:
    - nsis
    - zip
  icon: resources/icon.png

linux:
  target:
    - AppImage
    - deb
  category: Utility
  icon: resources/icon.png

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
